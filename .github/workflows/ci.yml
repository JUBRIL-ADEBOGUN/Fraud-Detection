name: Fraud API CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  PYTHON_VERSION: "3.10"
  DOCKER_IMAGE_NAME: xente-fraud-api

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt flake8 black

      - name: Run Black Formatter Check
        run: black --check src/serve.py src/train.py

      - name: Lint with Flake8
        run: flake8 src/serve.py src/train.py --count --show-source --statistics

  docker-build-test:
    name: Docker Build and Test
    needs: code-quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t ${{ env.DOCKER_IMAGE_NAME }}:latest .

      - name: Verify Docker Image
        run: docker images | grep ${{ env.DOCKER_IMAGE_NAME }}
